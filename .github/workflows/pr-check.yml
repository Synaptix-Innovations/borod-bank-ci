name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual trigger for testing

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Secret scanning — runs first, blocks all other jobs if secrets found ──
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for gitleaks

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --exit-code 1 --redact

  # ── 2. Dockerfile lint — runs in parallel with gitleaks ──────────────────────
  lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning # fail on warnings and above

  # ── 3. Compile + Tests + Coverage — waits for gitleaks ───────────────────────
  test:
    name: Compile + Test + Coverage
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # cache ~/.m2 between runs

      - name: Compile
        run: mvn compile -q

      - name: Test + Coverage Check
        # mvn verify runs: test → jacoco:report → jacoco:check (70% threshold)
        run: mvn verify -q

      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ── 4. Filesystem security scan — waits for gitleaks ─────────────────────────
  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs-report.txt
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true # skip vulns with no fix available

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt
          retention-days: 7

  # ── 5. Final gate — required status check in branch protection ────────────────
  # Set THIS job as the required check in GitHub branch protection settings.
  # That way adding new jobs above doesn't require updating protection rules.
  summary:
    name: PR Check Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, lint, test, trivy]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          results=(
            "gitleaks=${{ needs.gitleaks.result }}"
            "lint=${{ needs.lint.result }}"
            "test=${{ needs.test.result }}"
            "trivy=${{ needs.trivy.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            name="${r%%=*}"
            status="${r##*=}"
            if [[ "$status" != "success" ]]; then
              echo "❌ $name: $status"
              failed=1
            else
              echo "✅ $name: $status"
            fi
          done
          exit $failed
