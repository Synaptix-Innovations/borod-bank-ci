# OWASP ZAP Configuration for Borod Bank
# This file configures ZAP baseline scan behavior

# Ignore specific URLs (false positives or expected behavior)
# Format: IGNORE_URL <regex>

# Ignore static assets
IGNORE_URL .*\.css$
IGNORE_URL .*\.js$
IGNORE_URL .*\.jpg$
IGNORE_URL .*\.png$
IGNORE_URL .*\.gif$
IGNORE_URL .*\.svg$
IGNORE_URL .*\.woff$
IGNORE_URL .*\.woff2$
IGNORE_URL .*\.ttf$
IGNORE_URL .*\.eot$

# Ignore actuator endpoints (internal monitoring)
IGNORE_URL .*/actuator/.*

# Ignore logout endpoint (expected redirect)
IGNORE_URL .*/logout$

# Ignore specific alerts (if they are false positives)
# Format: IGNORE_ALERT <alert-id>

# Example: Ignore "X-Content-Type-Options Header Missing" for static assets
# IGNORE_ALERT 10021

# Custom scan policy
# SCAN_POLICY <policy-name>

# Authentication (if needed)
# AUTH_METHOD form
# AUTH_LOGIN_URL https://app.vladinnovations.info/login
# AUTH_USERNAME testuser
# AUTH_PASSWORD testpass

# Context (optional)
# CONTEXT_NAME borod-bank
# CONTEXT_URL https://app.vladinnovations.info

# Spider configuration
# MAX_DEPTH 5
# MAX_CHILDREN 10

# Active scan configuration
# ACTIVE_SCAN true
# ACTIVE_SCAN_POLICY Default Policy

# Report configuration
REPORT_TITLE "Borod Bank DAST Security Scan"
REPORT_AUTHOR "Jenkins Nightly Pipeline"
REPORT_DESCRIPTION "Automated DAST scan using OWASP ZAP baseline"

# Fail build on specific risk levels
# FAIL_ON_CRITICAL true
# FAIL_ON_HIGH true
# FAIL_ON_MEDIUM false
# FAIL_ON_LOW false

# Additional options
# TIMEOUT 60
# AJAX_SPIDER false
