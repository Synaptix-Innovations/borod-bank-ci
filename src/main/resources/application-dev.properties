# Dev: быстрые правки фронта
# 1) Без кэша шаблонов
spring.thymeleaf.cache=false

# 2) DevTools перезапускает приложение при изменении файлов в src
#    Правка CSS/HTML → сохранить → подождать 3–5 сек → F5 в браузере
spring.devtools.restart.enabled=true
# Путь к ресурсам: из корня репо — borod-bank-ci/src; из borod-bank-ci — src
spring.devtools.restart.additional-paths=./borod-bank-ci/src/main/resources,./src/main/resources
spring.devtools.restart.poll-interval=2s

# 3) Опционально: читать шаблоны и CSS с диска (только если запуск из папки borod-bank-ci)
#    Раскомментируй, если нужна правка без перезапуска (только F5):
#spring.thymeleaf.prefix=file:${user.dir}/src/main/resources/templates/
#spring.thymeleaf.suffix=.html
#spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:${user.dir}/src/main/resources/static/
